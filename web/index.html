<!doctype html>
<html lang="pt-BR">
<head>

  <title>Laboratório de otimização · Optimization lab</title>

<body>
  <a href="#main" class="skip-link" data-i18n="skip">Pular para o conteúdo</a>
  <header class="top">
    <div class="wrap top-row">
      <div>
        <h1 data-i18n="title">Laboratório de otimização</h1>
        <p class="subtitle" data-i18n="subtitle">O mesmo código Python testado, rodando no seu navegador</p>
      </div>
      <div class="top-actions">

        <div class="lang" role="group" aria-label="Idioma" data-i18n-label="language">
          <button type="button" data-lang="pt" aria-pressed="true">PT</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
    <div class="wrap">
      <nav class="tabs" role="tablist" aria-label="Seções">
